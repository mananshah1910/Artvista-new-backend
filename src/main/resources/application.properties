spring.application.name=Artvista-Backend
server.port=${PORT:8080}

# Database Configuration
# On Render, set: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/art_gallery?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Aditya@2234}

# HikariCP connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# Security (admin panel credentials)
spring.security.user.name=${ADMIN_EMAIL:2400090137@kluniversity.in}
spring.security.user.password=${ADMIN_PASSWORD:Manan@1910}

# CORS Configuration
# On Render, set ALLOWED_ORIGINS to your Vercel frontend URL
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,https://artvista-frontend-v2.vercel.app}

# Mail Configuration (Brevo REST API Bypass)
# On Render, set: EMAIL_API_KEY
brevo.api.key=${EMAIL_API_KEY:bskFVPtWSTJ1MmD}
# Sender email configured in Brevo
spring.mail.username=${MAIL_USERNAME:mananshah7263@gmail.com}
